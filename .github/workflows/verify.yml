name: verify
on:
  pull_request:
  push:
    branches: [master]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test
      - run: bun run build/build.ts
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
